<style>
/* ───────────────────────────────────────────────────────────────────────────
   Abou Sobhi — a single visual world, lifted off the shop's printed menu
   card: a mustard banner, tomato-red price chips, near-black type on warm
   paper. Deliberately single-theme, so every colour is painted explicitly
   and the page holds on either host ground.
   ─────────────────────────────────────────────────────────────────────── */
:root {
  --paper:   #FFFBF3;
  --card:    #FFFFFF;
  --cream:   #F7EFE1;
  --ink:     #17120E;
  --muted:   #7A6E63;
  --line:    #E8DFD1;
  --yellow:  #FFC629;
  --yellow-d:#E0A800;
  --yellow-s:#FFF0C2;
  --red:     #D7282F;
  --red-d:   #A81B21;
  --red-s:   #FCE9E9;

  /* Semantic order states — separate from the brand accent. */
  --st-new:  #2563EB;
  --st-prep: #D97706;
  --st-ready:#7C3AED;
  --st-out:  #0891B2;
  --st-done: #15803D;
  --st-cxl:  #9F1239;

  --sans: 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-xl: 26px;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  background-image:
    radial-gradient(circle at 12% 8%,  rgba(255,198,41,.10), transparent 46%),
    radial-gradient(circle at 92% 2%,  rgba(215,40,47,.07), transparent 40%);
  background-attachment: fixed;
  min-height: 100vh;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

/* ── Demo banner ────────────────────────────────────────────────────────── */
.demo-bar {
  background: var(--ink); color: var(--yellow);
  font-size: 12px; font-weight: 700; letter-spacing: .04em;
  padding: 8px 16px; text-align: center;
}
.demo-bar b { color: #fff; }

/* ── Page header ────────────────────────────────────────────────────────── */
.top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 19px; font-weight: 900; letter-spacing: -.01em; }
.brand p { margin: 0; font-size: 11px; font-weight: 700; color: var(--muted);
           text-transform: uppercase; letter-spacing: .12em; }
.top-actions { display: flex; align-items: center; gap: 8px; }

.seg { display: flex; gap: 3px; padding: 3px; background: var(--cream);
       border-radius: 999px; }
.seg button {
  padding: 7px 15px; border-radius: 999px; font-size: 13px; font-weight: 700;
  color: var(--muted); transition: background .15s, color .15s;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

.link-btn {
  padding: 8px 14px; border-radius: var(--r-md); font-size: 13px; font-weight: 700;
  background: var(--yellow); color: var(--ink);
}
.link-btn:hover { background: var(--yellow-d); }

/* ── The stage: customer phone beside the shop screen ───────────────────── */
.stage {
  display: grid; gap: 22px; padding: 22px 20px 60px;
  grid-template-columns: minmax(0, 1fr);
  max-width: 1560px; margin: 0 auto;
}
@media (min-width: 1080px) {
  .stage { grid-template-columns: 392px minmax(0, 1fr); align-items: start; }
  .pane-switch { display: none; }
  .pane { display: block !important; }
}

/* Below the two-column layout the viewer is already holding a phone, so the
   bezel is just wasted width — drop it and give the storefront the screen. */
@media (max-width: 1079px) {
  .phone { border: 1px solid var(--line); border-radius: var(--r-lg); height: 78vh; min-height: 520px; }
  .shopwin { height: 78vh; min-height: 520px; }
}

.pane-label {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 900; letter-spacing: .13em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
}
.pane-label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }

/* Phone frame — the customer's side of the demo. */
.phone {
  border: 9px solid var(--ink); border-radius: 34px; overflow: hidden;
  background: var(--paper); height: 720px; display: flex; flex-direction: column;
  box-shadow: 0 24px 50px -26px rgba(23,18,14,.5);
}
.phone-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }

.shopwin {
  border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden;
  background: var(--card); height: 720px; display: flex; flex-direction: column;
  box-shadow: 0 18px 44px -30px rgba(23,18,14,.4);
}
.shopwin-body { flex: 1; overflow-y: auto; background: var(--paper); }

/* ── Storefront ─────────────────────────────────────────────────────────── */
.sf-head { background: var(--ink); color: #fff; padding: 12px 16px;
           display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sf-head .name { font-size: 15px; font-weight: 900; }
.sf-head .tag { font-size: 9px; font-weight: 700; letter-spacing: .12em;
                text-transform: uppercase; color: var(--yellow); }
.pill-open { font-size: 10px; font-weight: 900; padding: 3px 9px; border-radius: 999px;
             background: rgba(21,128,61,.22); color: #6EE7A8; }

.hero { background: var(--yellow); padding: 20px 16px 22px; position: relative; overflow: hidden; }
.hero::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(135deg, rgba(23,18,14,.055) 0 10px, transparent 10px 20px);
}
.hero .kicker { position: relative; font-size: 10px; font-weight: 900; letter-spacing: .2em;
                text-transform: uppercase; color: var(--red); }
.hero h2 { position: relative; font-size: 30px; font-weight: 900; letter-spacing: -.02em;
           line-height: 1.1; margin-top: 4px; }
.hero p { position: relative; margin: 6px 0 0; font-size: 13px; font-weight: 600; color: #3B322A; }
.facts { position: relative; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.fact { background: rgba(255,255,255,.72); border: 1px solid rgba(23,18,14,.09);
        border-radius: var(--r-md); padding: 6px 10px; }
.fact dt { font-size: 9px; font-weight: 700; text-transform: uppercase;
           letter-spacing: .06em; color: var(--muted); }
.fact dd { margin: 0; font-size: 13px; font-weight: 900; }

.cat-nav { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--paper);
           position: sticky; top: 0; z-index: 5; scrollbar-width: none; }
.cat-nav::-webkit-scrollbar { display: none; }
.cat-nav button { flex: 0 0 auto; padding: 6px 12px; border-radius: 999px;
                  border: 1px solid var(--line); background: var(--card);
                  font-size: 12px; font-weight: 800; }
.cat-nav button:hover { border-color: var(--ink); background: var(--yellow); }

.sect { padding: 18px 16px 4px; }
.sect h3 { font-size: 19px; font-weight: 900; letter-spacing: -.01em;
           display: flex; align-items: center; gap: 10px; }
.sect h3 .rule { flex: 1; height: 7px; border-radius: 99px; background: var(--yellow);
                 background-image: repeating-linear-gradient(135deg, rgba(23,18,14,.08) 0 8px, transparent 8px 16px); }

.item {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 12px 14px; margin-top: 10px;
}
.item-top { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.item h4 { margin: 0; font-size: 14.5px; font-weight: 900; line-height: 1.25; }
.item .desc { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
.badge { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em;
         padding: 2px 7px; border-radius: 999px; }
.badge.signature { background: var(--ink); color: var(--yellow); }
.badge.popular   { background: var(--yellow); color: var(--ink); }
.badge.spicy     { background: var(--red); color: #fff; }
.sizes { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.size {
  display: flex; align-items: center; gap: 9px;
  border: 1px solid var(--line); background: var(--paper);
  border-radius: var(--r-md); padding: 6px 8px;
}
.size:hover { border-color: var(--ink); background: var(--card); }
.size .k { font-size: 10px; font-weight: 800; text-transform: uppercase;
           letter-spacing: .05em; color: var(--muted); }
.chip {
  background: var(--red); color: #fff; border-radius: var(--r-sm);
  padding: 4px 8px; font-weight: 800; line-height: 1.15; text-align: center;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.14);
}
.chip .lbp { font-size: 12px; display: block; }
.chip .usd { font-size: 9px; opacity: .85; display: block; }
.soldout { font-size: 11px; font-weight: 800; color: var(--muted);
           background: var(--cream); border-radius: var(--r-sm); padding: 5px 10px; }

/* Sticky cart bar inside the phone. */
.cartbar {
  position: sticky; bottom: 0; margin: 14px 12px 12px; padding: 11px 14px;
  background: var(--ink); color: #fff; border-radius: var(--r-lg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  box-shadow: 0 12px 26px -14px rgba(23,18,14,.7);
}
.cartbar .count { background: var(--yellow); color: var(--ink); font-weight: 900;
                  width: 27px; height: 27px; border-radius: 50%;
                  display: grid; place-items: center; font-size: 13px; }
.cartbar .lbl { font-size: 13px; font-weight: 800; }

/* ── Forms ──────────────────────────────────────────────────────────────── */
.field { width: 100%; border: 1px solid var(--line); background: var(--card);
         border-radius: var(--r-md); padding: 9px 11px; font-size: 13px; }
.field:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(255,198,41,.5); }
.lbl { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase;
       letter-spacing: .07em; color: var(--muted); margin-bottom: 5px; }
.err { color: var(--red); font-size: 11px; font-weight: 800; margin-top: 4px; display: block; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px;
       border-radius: var(--r-md); padding: 10px 15px; font-size: 13px; font-weight: 800;
       transition: background .15s, transform .06s; }
.btn:active { transform: scale(.98); }
.btn-red    { background: var(--red); color: #fff; }
.btn-red:hover { background: var(--red-d); }
.btn-ink    { background: var(--ink); color: #fff; }
.btn-yellow { background: var(--yellow); color: var(--ink); }
.btn-ghost  { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn-sm { padding: 6px 11px; font-size: 11.5px; }
.btn-block { width: 100%; }

.toggle-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.toggle {
  border: 2px solid var(--line); background: var(--card); border-radius: var(--r-md);
  padding: 9px; font-size: 12.5px; font-weight: 800; text-align: center;
}
.toggle[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }

.check { display: flex; align-items: center; gap: 9px; border: 2px solid var(--line);
         background: var(--card); border-radius: var(--r-md); padding: 8px 10px;
         cursor: pointer; font-size: 12.5px; font-weight: 700; }
.check[data-on="1"] { border-color: var(--ink); }
.check input { accent-color: var(--red); width: 15px; height: 15px; }
.check .price { margin-inline-start: auto; color: var(--red); font-weight: 800; font-size: 11.5px; }

.stepper { display: inline-flex; align-items: center; gap: 3px;
           border: 1px solid var(--line); border-radius: var(--r-md);
           background: var(--card); padding: 3px; }
.stepper button { width: 30px; height: 30px; border-radius: var(--r-sm);
                  background: var(--cream); font-weight: 900; font-size: 16px; }
.stepper .n { width: 38px; text-align: center; font-weight: 900; }

/* ── Map ────────────────────────────────────────────────────────────────── */
.mapwrap { position: relative; border: 1px solid var(--line); border-radius: var(--r-md);
           overflow: hidden; background: #EDE7DB; touch-action: none; }
.mapwrap canvas { display: block; width: 100%; height: 172px; cursor: grab; }
.mapwrap.dragging canvas { cursor: grabbing; }
.map-note { font-size: 10px; color: var(--muted); margin-top: 5px; }
.map-coords { position: absolute; inset-inline-start: 7px; bottom: 7px;
              background: rgba(255,251,243,.94); border-radius: 6px;
              padding: 2px 7px; font-size: 10px; font-weight: 600; }
.map-badge { position: absolute; inset-inline-end: 7px; top: 7px;
             background: rgba(23,18,14,.82); color: var(--yellow);
             border-radius: 6px; padding: 2px 7px; font-size: 9px; font-weight: 800; }

/* ── Status ─────────────────────────────────────────────────────────────── */
.st { font-size: 10px; font-weight: 900; color: #fff; padding: 2px 8px; border-radius: 999px; }
.st.new{background:var(--st-new)} .st.preparing{background:var(--st-prep)}
.st.ready{background:var(--st-ready)} .st.delivering{background:var(--st-out)}
.st.done{background:var(--st-done)} .st.cancelled{background:var(--st-cxl)}

.track { display: flex; gap: 4px; }
.track li { flex: 1; list-style: none; }
.track .bead { display: grid; place-items: center; width: 25px; height: 25px;
               border-radius: 50%; font-size: 11px; font-weight: 900;
               background: var(--line); color: var(--muted); }
.track .bead.on { color: #fff; }
.track .bar { height: 4px; border-radius: 99px; background: var(--line); flex: 1; }
.track .row { display: flex; align-items: center; }
.track .cap { font-size: 9.5px; font-weight: 800; margin-top: 5px; color: var(--muted); }
.track .cap.on { color: var(--ink); }

/* ── Shop panel ─────────────────────────────────────────────────────────── */
.shop-nav { display: flex; gap: 4px; padding: 10px 14px; background: var(--ink); overflow-x: auto;
            scrollbar-width: none; }
.shop-nav::-webkit-scrollbar { display: none; }
.shop-nav button { flex: 0 0 auto; padding: 7px 13px; border-radius: var(--r-md);
                   font-size: 12.5px; font-weight: 800; color: rgba(255,255,255,.62); }
.shop-nav button:hover { background: rgba(255,255,255,.1); color: #fff; }
.shop-nav button[aria-pressed="true"] { background: var(--yellow); color: var(--ink); }
.shop-nav .badge-n { background: var(--red); color: #fff; border-radius: 999px;
                     padding: 0 6px; font-size: 10px; margin-inline-start: 6px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
         gap: 10px; padding: 14px; }
.stat { background: var(--card); border: 1px solid var(--line);
        border-radius: var(--r-lg); padding: 12px 14px; }
.stat.hl { background: var(--yellow); border-color: var(--yellow-d); }
.stat.alert { background: var(--red); border-color: var(--red-d); color: #fff; }
.stat dt { font-size: 10px; font-weight: 900; text-transform: uppercase;
           letter-spacing: .06em; opacity: .65; }
.stat dd { margin: 3px 0 0; font-size: 22px; font-weight: 900; letter-spacing: -.01em; }
.stat .sub { font-size: 11px; font-weight: 700; opacity: .7; }

.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
         gap: 12px; padding: 0 14px 18px; align-items: start; }
.col h4 { font-size: 11px; font-weight: 900; text-transform: uppercase;
          letter-spacing: .08em; color: var(--muted); margin-bottom: 8px;
          display: flex; align-items: center; gap: 7px; }
.col h4 .n { background: var(--cream); border-radius: 999px; padding: 1px 7px; font-size: 10px; }

.ocard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
         padding: 12px; margin-bottom: 10px; }
.ocard.fresh { border-color: rgba(215,40,47,.55); box-shadow: 0 0 0 3px rgba(215,40,47,.12); }
.ocard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.onum { display: grid; place-items: center; width: 30px; height: 30px; border-radius: var(--r-sm);
        background: var(--ink); color: var(--yellow); font-weight: 900; font-size: 13px; }
.ocard .who { font-size: 13px; font-weight: 900; }
.ocard .code { font-size: 10.5px; font-weight: 600; color: var(--muted); }
.age { font-size: 10px; font-weight: 900; padding: 2px 7px; border-radius: 999px;
       background: var(--cream); color: var(--ink); }
.age.warn { background: var(--yellow); }
.age.late { background: var(--red); color: #fff; }
.olines { background: var(--paper); border-radius: var(--r-md); padding: 9px 10px;
          margin: 9px 0; font-size: 12.5px; }
.olines .q { color: var(--red); font-weight: 900; }
.olines .ad { color: var(--muted); font-size: 11px; padding-inline-start: 14px; display: block; }
.olines .nt { color: var(--red); font-size: 11px; font-style: italic;
              padding-inline-start: 14px; display: block; font-weight: 700; }
.onote { background: var(--yellow-s); border-radius: var(--r-sm); padding: 6px 9px;
         font-size: 11.5px; font-weight: 700; margin-bottom: 9px; }
.ofoot { display: flex; align-items: center; justify-content: space-between;
         gap: 10px; font-size: 12px; }
.ofoot .zone { font-size: 10.5px; font-weight: 800; text-transform: uppercase;
               letter-spacing: .04em; color: var(--muted); }
.ofoot .tot { font-size: 15px; font-weight: 900; }
.oacts { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px;
         border-top: 1px solid var(--line); }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th { text-align: start; font-size: 10px; font-weight: 900; text-transform: uppercase;
           letter-spacing: .06em; color: var(--muted); padding: 8px 10px;
           border-bottom: 1px solid var(--line); background: var(--paper); }
tbody td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
tbody tr:hover { background: var(--paper); }
.tablewrap { background: var(--card); border: 1px solid var(--line);
             border-radius: var(--r-lg); overflow: auto; margin: 0 14px 18px; }

.panel-card { background: var(--card); border: 1px solid var(--line);
              border-radius: var(--r-lg); margin: 0 14px 14px; overflow: hidden; }
.panel-card > h4 { padding: 11px 14px; border-bottom: 1px solid var(--line);
                   background: var(--paper); font-size: 11px; font-weight: 900;
                   text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.menu-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            padding: 10px 14px; border-bottom: 1px solid var(--line); }
.menu-row:last-child { border-bottom: none; }
.menu-row .nm { flex: 1 1 170px; font-size: 13px; font-weight: 800; }
.menu-row .nm small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
.price-in { width: 118px; text-align: center; }
.sw { position: relative; width: 42px; height: 23px; border-radius: 999px;
      background: var(--line); transition: background .18s; flex: 0 0 auto; }
.sw::after { content: ''; position: absolute; top: 2.5px; inset-inline-start: 2.5px;
             width: 18px; height: 18px; border-radius: 50%; background: #fff;
             box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .18s; }
.sw[data-on="1"] { background: var(--st-done); }
[dir="ltr"] .sw[data-on="1"]::after { transform: translateX(19px); }
[dir="rtl"] .sw[data-on="1"]::after { transform: translateX(-19px); }

/* ── Chart: one series, one hue, validated against the light surface ────── */
.chart { display: flex; gap: 10px; }
.chart .yax { width: 46px; display: flex; flex-direction: column;
              justify-content: space-between; padding: 16px 0 0; text-align: end; }
.chart .yax span { font-size: 9.5px; font-weight: 700; color: var(--muted); }
.plot { position: relative; height: 152px; padding-top: 16px; flex: 1; min-width: 0; }
.grid-line { position: absolute; inset-inline: 0; border-top: 1px solid var(--line); }
.cols { position: relative; display: flex; align-items: flex-end; gap: 5px; height: 100%; }
.colw { flex: 1; height: 100%; display: flex; align-items: flex-end;
        justify-content: center; position: relative; }
.bar { width: 100%; max-width: 22px; background: var(--red);
       border-radius: 4px 4px 0 0; transition: opacity .15s; }
.colw:hover .bar { opacity: .78; }
.bar-lab { position: absolute; font-size: 9.5px; font-weight: 900; }
.tip { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
       margin-bottom: 5px; background: var(--ink); color: #fff; border-radius: 7px;
       padding: 4px 8px; font-size: 10px; font-weight: 700; white-space: nowrap;
       opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 3; }
.colw:hover .tip, .colw:focus-visible .tip { opacity: 1; }
.xax { display: flex; gap: 5px; margin-top: 6px; }
.xax span { flex: 1; text-align: center; font-size: 9px; font-weight: 700; color: var(--muted); }
.meter { display: block; height: 6px; border-radius: 99px;

.meter i { display: block; height: 100%; border-radius: 99px; background: var(--red); }

/* ── Sheet ──────────────────────────────────────────────────────────────── */
.scrim { position: absolute; inset: 0; background: rgba(23,18,14,.45); z-index: 20;
         display: flex; align-items: flex-end; }
.sheet { background: var(--paper); width: 100%; max-height: 94%;

  for (let i = 0; i < d.length; i++) {
    if (i > 0 && (d.length - i) % 3 === 0) out += ',';
    out += d[i];
  }
  return out;
};
const lbp = (n) => group(n) + (S.lang === 'ar' ? ' ل.ل' : ' LBP');
const usd = (n) => (S.cfg.rate > 0 ? '$' + (n / S.cfg.rate).toFixed(2) : '');

/* Price of a variant, honouring any change the shop made in the demo. */
const priceOf = (slug, kind) => {
  const key = slug + ':' + kind;
  if (S.cfg.prices[key] != null) return S.cfg.prices[key];
  const p = PRODUCTS[slug];
  const v = p && p.variants.find((x) => x.k === kind);
  return v ? v.p : 0;
};
const addonPrice = (slug) => {
  const key = 'addon:' + slug;
  if (S.cfg.prices[key] != null) return S.cfg.prices[key];
  const a = MENU.addons.find((x) => x.slug === slug);
  return a ? a.p : 0;
};

const lineTotal = (l) => (priceOf(l.slug, l.kind) + l.addons.reduce((s, a) => s + addonPrice(a), 0)) * l.qty;

const deliveryFee = () => {
  if (S.form.type !== 'delivery') return 0;
  const sub = cartSubtotal();
  if (SHOP.freeOver > 0 && sub >= SHOP.freeOver) return 0;
  const z = ZONES[S.form.zone];

};

/* Lebanese phone: eight national digits; 7x mobiles carry no leading zero. */
const MOBILE = ['70', '71', '76', '78', '79', '81'];
const ZEROED = ['01', '03', '04', '05', '06', '07', '08', '09'];
function normPhone(raw) {
  let d = String(raw || '').replace(/\D/g, '');
  if (d.startsWith('00961')) d = d.slice(5);
  else if (d.startsWith('961') && d.length > 8) d = d.slice(3);
  if (d.length === 7 && d[0] !== '0') d = '0' + d;
  if (d.length === 9 && d[0] === '0' && MOBILE.includes(d.slice(1, 3))) d = d.slice(1);
  if (d.length !== 8) return null;
  const p = d.slice(0, 2);
  return MOBILE.includes(p) || ZEROED.includes(p) ? d : null;
}
const showPhone = (d) => (d ? d.slice(0, 2) + ' ' + d.slice(2, 5) + ' ' + d.slice(5) : '');

function makeCode() {
  const b = new Uint8Array(6);
  (crypto || window.crypto).getRandomValues(b);
  let c = '';
  for (let i = 0; i < 6; i++) c += CODE_ALPHABET[b[i] % CODE_ALPHABET.length];
  return c;
}
const showCode = (c) => (c && c.length === 6 ? c.slice(0, 3) + '-' + c.slice(3) : c || '');

const clock = (d) => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
const stamp = (ms) => {
  const d = new Date(ms);
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + clock(d);
};
const dayKey = (ms) => { const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ───────────────────────────────────────────────────────────────────────────
   Storage. When the viewer's runtime grants `db`, orders are shared across
   every open screen — which is the whole point of the demo: order on a phone,
   watch it land on the shop's laptop. Without it the page still works, one
   device at a time, so the demo never simply breaks.
   ─────────────────────────────────────────────────────────────────────── */
let DB = null;
const LOCAL_KEY = 'abou-sobhi-demo:v1';

function readLocal() {
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}
function writeLocal() {
  try {
    localStorage.setItem(LOCAL_KEY, JSON.stringify({ orders: S.orders, cfg: S.cfg }));
  } catch { /* private mode: the demo simply does not persist */ }
}

function markSync(on) {
  const el = $('syncDot');
  el.classList.toggle('off', !on);
  el.lastElementChild.textContent = on ? t('synced') : t('local');
}

async function initStore() {
  const local = readLocal();
  if (local) {
    S.orders = Array.isArray(local.orders) ? local.orders : [];
    if (local.cfg) S.cfg = Object.assign(S.cfg, local.cfg);
  }
  S.orders.forEach((o) => S.seen.add(o.id));
  renderShop();

  if (typeof window.claude === 'undefined') {
    // Served as a plain web page: there is no capability layer to report on.
    $('syncDot').style.display = 'none';
    return;
  }
  let api = null;
  try { api = await window.claude.use('db'); } catch { api = null; }
  if (!api) { markSync(false); return; }
  DB = api;
  markSync(true);

  DB.collection('orders').orderBy('createdAt', 'desc').limit(120).onSnapshot(
    (snap) => {
      S.orders = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      S.orders.forEach((o) => S.seen.add(o.id));
      if (S.myOrder) {
        const mine = S.orders.find((o) => o.id === S.myOrder.id);
        if (mine) S.myOrder = mine;
      }
      renderShop();
      if (S.step === 'tracking') renderCustomer();
    },
    () => markSync(false),
  );

  DB.doc('config/menu').onSnapshot(
    (snap) => {
      const d = snap.exists ? snap.data() : null;
      if (d) {
        S.cfg = {
          prices: d.prices && typeof d.prices === 'object' ? d.prices : {},
          soldOut: Array.isArray(d.soldOut) ? d.soldOut : [],
          rate: typeof d.rate === 'number' ? d.rate : 89500,
        };
        renderAll();
      }
    },
    () => {},
  );
}

async function saveOrder(order) {
  if (DB) {
    try {
      const ref = await DB.collection('orders').add(order);
      return Object.assign({ id: ref.id }, order);
    } catch { /* fall through to local */ }
  }
  const local = Object.assign({ id: 'local-' + Date.now().toString(36) }, order);
  S.orders = [local].concat(S.orders);
  S.seen.add(local.id);
  writeLocal();
  return local;
}

async function patchOrder(id, patch) {
  const i = S.orders.findIndex((o) => o.id === id);
  if (i >= 0) S.orders[i] = Object.assign({}, S.orders[i], patch);
  if (S.myOrder && S.myOrder.id === id) S.myOrder = Object.assign({}, S.myOrder, patch);
  renderShop();
  if (S.step === 'tracking') renderCustomer();
  if (DB && !String(id).startsWith('local-')) {
    try { await DB.doc('orders/' + id).update(patch); return; } catch { /* keep local copy */ }
  }
  writeLocal();
}

async function saveConfig() {
  renderAll();
  if (DB) {
    try { await DB.doc('config/menu').set({ prices: S.cfg.prices, soldOut: S.cfg.soldOut, rate: S.cfg.rate }); return; } catch { /* local */ }
  }
  writeLocal();
}

/* ───────────────────────────────────────────────────────────────────────────
   The map. OpenStreetMap tiles cannot load inside a published artifact, so
   this is a drawn stand-in for the real Leaflet map — clearly badged as such.
   What it demonstrates is the mechanism that matters: the pin is the address,
   and the coordinates it produces are what reaches the shop.
   ─────────────────────────────────────────────────────────────────────── */
const SPAN = { lng: 0.048, lat: 0.030 };

function drawMap() {
  const cv = $('mapCanvas');
  if (!cv) return;
  const wrap = cv.parentElement;
  const w = wrap.clientWidth, h = 172;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.height = h + 'px';
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  g.fillStyle = '#EDE6D8'; g.fillRect(0, 0, w, h);

  // Tripoli sits on the coast; a sea edge orients the viewer immediately.
  g.fillStyle = '#BFD6DA';
  g.beginPath();
  g.moveTo(0, h);
  g.lineTo(0, h * 0.62);
  for (let x = 0; x <= w; x += 12) g.lineTo(x, h * 0.62 + Math.sin(x / 46) * 7 + x * 0.05);
  g.lineTo(w, h); g.closePath(); g.fill();

  // Blocks and streets, drawn coarse so it reads as a map, not a diagram.
  g.fillStyle = '#E3DACA';
  const seed = (i) => (Math.sin(i * 12.9898) * 43758.5453) % 1;
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 8; c++) {
      const x = c * (w / 8) + 4, y = r * 26 + 6;
      if (y + 20 > h * 0.62 + Math.sin(x / 46) * 7 + x * 0.05) continue;
      const jitter = Math.abs(seed(r * 8 + c)) * 6;
      g.fillRect(x, y, w / 8 - 9 - jitter, 19);
    }
  }
  g.strokeStyle = '#D6CBB6'; g.lineWidth = 3;
  for (let r = 1; r < 5; r++) { g.beginPath(); g.moveTo(0, r * 26); g.lineTo(w, r * 26 + 4); g.stroke(); }
  for (let c = 1; c < 8; c++) { g.beginPath(); g.moveTo(c * (w / 8), 0); g.lineTo(c * (w / 8) - 6, h); g.stroke(); }

  // The shop itself, so the customer can see how far they are from it.
  const sx = w / 2, sy = h / 2;
  g.fillStyle = '#17120E';
  g.beginPath(); g.arc(sx, sy, 4.5, 0, Math.PI * 2); g.fill();
  g.font = '700 9px Cairo, sans-serif'; g.textAlign = 'center';
  g.fillText(S.lang === 'ar' ? 'المحل' : 'Shop', sx, sy - 9);

  const pin = S.pin || { lat: SHOP.lat + SPAN.lat * 0.18, lng: SHOP.lng - SPAN.lng * 0.2 };
  const px = w / 2 + ((pin.lng - SHOP.lng) / SPAN.lng) * w;
  const py = h / 2 - ((pin.lat - SHOP.lat) / SPAN.lat) * h;

  g.globalAlpha = S.pin ? 1 : 0.45;
  g.fillStyle = '#D7282F';
  g.beginPath();
  g.moveTo(px, py);
  g.bezierCurveTo(px - 12, py - 13, px - 10, py - 27, px, py - 27);
  g.bezierCurveTo(px + 10, py - 27, px + 12, py - 13, px, py);
  g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(px, py - 18, 4.2, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;
}

function pinFromEvent(ev) {
  const cv = $('mapCanvas');
  const r = cv.getBoundingClientRect();
  const x = Math.max(0, Math.min(r.width, ev.clientX - r.left));
  const y = Math.max(0, Math.min(r.height, ev.clientY - r.top));
  return {
    lng: SHOP.lng + ((x - r.width / 2) / r.width) * SPAN.lng,
    lat: SHOP.lat - ((y - r.height / 2) / r.height) * SPAN.lat,
  };
}

function niceCeil(v) {
  if (v <= 0) return 1;
  const m = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / m;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * m;
}
const compact = (v) => (v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'M' : v >= 1000 ? Math.round(v / 1000) + 'K' : String(v));

function renderReports() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i); d.setHours(0, 0, 0, 0);
    days.push({ key: dayKey(d.getTime()), label: String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'), rev: 0, n: 0 });
  }
  const byKey = {}; days.forEach((d) => { byKey[d.key] = d; });
  S.orders.forEach((o) => {
    if (o.status === 'cancelled') return;
    const d = byKey[dayKey(o.createdAt)];
    if (d) { d.rev += o.total; d.n += 1; }
  });

  const total = days.reduce((s, d) => s + d.rev, 0);
  const count = days.reduce((s, d) => s + d.n, 0);
  const max = niceCeil(Math.max.apply(null, days.map((d) => d.rev).concat([0])));
  const best = days.reduce((a, b) => (b.rev > a.rev ? b : a), days[0]);
  const ticks = [max, max / 2, 0];

  const gridlines = ticks.map((tk) => '<span class="grid-line" style="top:calc(16px + ' + ((1 - tk / max) * 100) + '% - ' + ((1 - tk / max) * 16) + 'px)"></span>').join('');
  const cols = days.map((d, i) => {
    const ratio = max ? d.rev / max : 0;
    const label = d.rev > 0 && (i === days.length - 1 || (best && d.key === best.key && best.rev > 0));
    return '<div class="colw" tabindex="0">'
      + (label ? '<span class="bar-lab num" style="bottom:calc(' + (ratio * 100) + '% + 4px)">' + compact(d.rev) + '</span>' : '')
      + '<span class="bar" style="height:' + (d.rev > 0 ? Math.max(ratio * 100, 1.5) + '%' : '2px') + '"></span>'
      + '<span class="tip num">' + d.label + ' · ' + group(d.rev) + '<br>' + d.n + ' ' + esc(t('ordersLabel')) + '</span></div>';
  }).join('');

  const chart = '<div class="panel-card" style="margin-top:14px"><h4>' + esc(t('revByDay')) + '</h4>'
    + '<div style="padding:14px"><div class="chart" dir="ltr">'
    + '<div class="yax">' + ticks.map((tk) => '<span class="num">' + compact(tk) + '</span>').join('') + '</div>'
    + '<div style="flex:1;min-width:0"><div class="plot">' + gridlines + '<div class="cols">' + cols + '</div></div>'
    + '<div class="xax">' + days.map((d) => '<span class="num">' + d.label + '</span>').join('') + '</div>'
    + '</div></div></div></div>';

  const hero = '<div class="panel-card" style="margin-top:14px"><div style="padding:16px">'
    + '<div class="lbl">' + esc(t('last7')) + '</div>'
    + '<div style="font-size:36px;font-weight:900;letter-spacing:-.02em;line-height:1.05">' + esc(lbp(total)) + '</div>'
    + '<div style="font-size:12.5px;font-weight:700;color:var(--muted);margin-top:5px">'
    + esc(usd(total)) + ' · ' + count + ' ' + esc(t('ordersLabel'))
    + (count ? ' · ' + esc(t('avg')) + ' ' + esc(lbp(Math.round(total / count))) : '') + '</div></div></div>';

  const table = '<div class="panel-card"><h4>' + esc(t('revTable')) + '</h4>'
    + '<table><thead><tr><th>' + esc(t('day')) + '</th><th style="text-align:end">' + esc(t('ordersLabel'))
    + '</th><th style="text-align:end">' + esc(t('revToday')) + '</th></tr></thead><tbody>'
    + days.slice().reverse().map((d) => '<tr><td class="num mono" dir="ltr">' + d.key + '</td>'
      + '<td class="num" style="text-align:end;color:var(--muted)">' + d.n + '</td>'
      + '<td class="num" style="text-align:end;font-weight:800">' + group(d.rev) + '</td></tr>').join('')
    + '</tbody></table></div>';

  const tally = {};
  S.orders.forEach((o) => {
    if (o.status === 'cancelled') return;
    o.items.forEach((l) => {
      const k = l.slug;
      if (!tally[k]) tally[k] = { slug: k, qty: 0, rev: 0 };
      tally[k].qty += l.qty; tally[k].rev += l.total;
    });
  });
  const top = Object.values(tally).sort((a, b) => b.qty - a.qty).slice(0, 8);
  const topMax = Math.max.apply(null, top.map((x) => x.qty).concat([1]));
  const tops = top.length
    ? '<table><thead><tr><th>' + esc(t('item')) + '</th><th style="text-align:end">' + esc(t('count'))
      + '</th><th style="text-align:end">' + esc(t('totalCol')) + '</th></tr></thead><tbody>'
      + top.map((x) => '<tr><td><b>' + esc(L(PRODUCTS[x.slug].ar, PRODUCTS[x.slug].en)) + '</b>'
        + '<span class="meter"><i style="width:' + ((x.qty / topMax) * 100) + '%"></i></span></td>'
        + '<td class="num" style="text-align:end;font-weight:900">' + x.qty + '</td>'
        + '<td class="num" style="text-align:end;color:var(--muted)">' + group(x.rev) + '</td></tr>').join('')
      + '</tbody></table>'
    : '<div class="empty" style="padding:28px">' + esc(t('noOrders')) + '</div>';

  return hero + chart + '<div class="panel-card"><h4>' + esc(t('topItems')) + '</h4>' + tops + '</div>' + table;
}

function renderReceiptSheet(o) {
  const lines = o.items.map((l) => '<div class="rrow" style="font-weight:700"><span>' + l.qty + '× '
    + esc(L(l.ar, l.en)) + ' <span style="font-weight:400;color:var(--muted)">(' + esc(kindLabel(l.kind)) + ')</span></span>'
    + '<span class="num">' + esc(group(l.total)) + '</span></div>'
    + l.addons.map((a) => '<div style="padding-inline-start:14px;color:var(--muted);font-size:11px">+ ' + esc(L(ADDONS[a].ar, ADDONS[a].en)) + '</div>').join('')
    + (l.notes ? '<div style="padding-inline-start:14px;font-style:italic;font-size:11px">“' + esc(l.notes) + '”</div>' : '')).join('');

  const addr = o.type === 'delivery'
    ? '<div class="dash"></div><div style="font-weight:900;font-size:10px;text-transform:uppercase;letter-spacing:.06em">' + esc(t('address')) + '</div>'
      + '<div style="font-size:11.5px;margin-top:3px">' + esc([L(ZONES[o.zone].ar, ZONES[o.zone].en), o.street, o.building, o.floor].filter(Boolean).join('، ')) + '</div>'
      + (o.lat != null ? '<div class="mono" dir="ltr" style="font-size:11px;margin-top:3px">' + o.lat.toFixed(5) + ', ' + o.lng.toFixed(5) + '</div>' : '')
    : '';

  return '<div class="receipt" style="max-width:320px;margin:0 auto">'
    + '<div style="text-align:center"><div style="font-weight:900;font-size:16px">' + esc(t('brand')) + '</div>'
    + '<div style="font-size:11px;color:var(--muted)">' + esc(L('طرابلس، لبنان', 'Tripoli, Lebanon')) + '</div></div>'
    + '<div class="dash"></div>'
    + '<div class="rrow" style="align-items:baseline"><span class="num" style="font-size:26px;font-weight:900">#' + o.dailyNumber + '</span>'
    + '<span class="mono" dir="ltr" style="font-weight:600">' + esc(showCode(o.code)) + '</span></div>'
    + '<div class="dash"></div>'
    + '<div class="rrow" style="font-size:11.5px"><span style="color:var(--muted)">' + esc(t('placedAt')) + '</span>'
    + '<span class="mono num" dir="ltr">' + esc(stamp(o.createdAt)) + '</span></div>'
    + '<div class="rrow" style="font-size:11.5px"><span style="color:var(--muted)">' + esc(t('customerCol')) + '</span>'
    + '<span>' + esc(o.name) + ' · <span class="mono" dir="ltr">' + esc(showPhone(o.phone)) + '</span></span></div>'
    + '<div class="dash"></div>' + lines + '<div class="dash"></div>'
    + '<div class="rrow"><span style="color:var(--muted)">' + esc(t('subtotal')) + '</span><span class="num">' + esc(group(o.subtotal)) + '</span></div>'
    + (o.fee > 0 ? '<div class="rrow"><span style="color:var(--muted)">' + esc(t('delivery')) + '</span><span class="num">' + esc(group(o.fee)) + '</span></div>' : '')
    + '<div class="rrow" style="font-weight:900;font-size:15px;border-top:1px solid var(--line);padding-top:6px;margin-top:5px">'
    + '<span>' + esc(t('total')) + '</span><span class="num">' + esc(group(o.total)) + '</span></div>'
    + '<div class="rrow" style="font-size:11px;color:var(--muted)"><span>≈ USD</span><span class="num">' + esc(usd(o.total)) + '</span></div>'
    + addr + '</div>';
}

let receiptFor = null;

function renderShop() {
  const nav = [['board', 'board', S.orders.filter((o) => o.status === 'new').length], ['orders', 'orders', 0],
               ['menu', 'menuMgr', 0], ['reports', 'reports', 0]]
    .map(([id, key, n]) => '<button data-tab="' + id + '" aria-pressed="' + (S.shopTab === id) + '">'
      + esc(t(key)) + (n ? '<span class="badge-n num">' + n + '</span>' : '') + '</button>').join('');
  $('shopNav').innerHTML = nav;

  const view = $('shopView');
  const keep = view.scrollTop;
  let html = S.shopTab === 'orders' ? renderOrdersTable()
    : S.shopTab === 'menu' ? renderMenuManager()
    : S.shopTab === 'reports' ? renderReports()
    : renderBoard();
  if (receiptFor) {
    const o = S.orders.find((x) => x.id === receiptFor);
    if (o) html += sheetShell(t('receipt'), renderReceiptSheet(o), '');
    else receiptFor = null;
  }
  view.innerHTML = html;
  view.scrollTop = keep;
}

function renderChrome() {
  document.documentElement.setAttribute('dir', S.lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', S.lang);
  $('demoBar').innerHTML = '<b>' + t('demoStrong') + '</b> · ' + esc(t('demo'));
  $('brandName').textContent = t('brand');
  $('brandTag').textContent = t('tag');
  $('langBtn').textContent = S.lang === 'ar' ? 'English' : 'العربية';
  $('labCustomer').textContent = t('customer');
  $('labShop').textContent = t('shop');
  $('paneSwitch').innerHTML =
    '<button data-pane="customer" aria-pressed="' + (S.pane === 'customer') + '">' + esc(t('switchCustomer')) + '</button>'
    + '<button data-pane="shop" aria-pressed="' + (S.pane === 'shop') + '">' + esc(t('switchShop')) + '</button>';
  $('paneCustomer').style.display = S.pane === 'customer' ? '' : 'none';
  $('paneShop').style.display = S.pane === 'shop' ? '' : 'none';
  markSync(!!DB);
}

function renderAll() { renderChrome(); renderCustomer(); renderShop(); }

/* ───────────────────────────────────────────────────────────────────────────
   Events. Delegated per pane, so a re-render never leaves a stale listener.
   ─────────────────────────────────────────────────────────────────────── */
const parseMoney = (raw) => {
  const n = Number(String(raw).replace(/[^\d.]/g, ''));
  return Number.isFinite(n) && n >= 0 ? Math.round(n) : null;
};

function validate() {
  const f = S.form, e = {};
  if (f.name.trim().length < 2) e.name = t('required');
  if (!normPhone(f.phone)) e.phone = t('badPhone');
  if (f.type === 'delivery') {
    if (!f.zone) e.zone = t('needArea');
    if (!S.pin) e.pin = t('needPin');
  }
  S.errors = e;
  return !Object.keys(e).length;
}

async function submitOrder() {
  if (!validate()) { renderCustomer(); return; }
  S.sending = true; renderCustomer();

  const sub = cartSubtotal(), fee = deliveryFee();
  const order = {
    code: makeCode(),
    dailyNumber: todaysOrders().length + 1,
    status: 'new',
    type: S.form.type,
    name: S.form.name.trim(),
    phone: normPhone(S.form.phone),
    zone: S.form.type === 'delivery' ? S.form.zone : null,
    street: S.form.street.trim(),
    building: S.form.building.trim(),
    floor: S.form.floor.trim(),
    lat: S.form.type === 'delivery' && S.pin ? S.pin.lat : null,
    lng: S.form.type === 'delivery' && S.pin ? S.pin.lng : null,
    notes: S.form.notes.trim(),
    items: S.cart.map((l) => ({
      slug: l.slug, ar: PRODUCTS[l.slug].ar, en: PRODUCTS[l.slug].en,
      kind: l.kind, addons: l.addons.slice(), qty: l.qty,
      notes: l.notes, total: lineTotal(l),
    })),
    subtotal: sub, fee: fee, total: sub + fee,
    createdAt: Date.now(),
  };

  const saved = await saveOrder(order);
  S.myOrder = saved;
  S.cart = [];
  S.sending = false;
  S.step = 'tracking';
  S.errors = {};
  renderAll();
}

$('customerView').addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-jump],[data-pick],[data-open-cart],[data-close],[data-scrim],'
    + '[data-size],[data-sq],[data-add],[data-qty],[data-rm],[data-clear],[data-go-checkout],'
    + '[data-type],[data-back],[data-submit],[data-locate],[data-restart]');
  if (!el) return;
  const d = el.dataset;

  if (d.scrim && ev.target !== el) return;
  if (d.jump) {
    const sec = document.getElementById('cat-' + d.jump);
    if (sec) $('customerView').scrollTo({ top: sec.offsetTop - 52, behavior: 'smooth' });
    return;
  }
  if (d.pick) { S.sheet = { slug: d.pick, kind: d.kind, addons: [], qty: 1, notes: '' }; renderCustomer(); return; }
  if (d.openCart) { S.sheet = { kind: '__cart__' }; renderCustomer(); return; }
  if (d.close || d.scrim) { S.sheet = null; renderCustomer(); return; }
  if (d.size) { S.sheet.kind = d.size; renderCustomer(); return; }
  if (d.sq) { S.sheet.qty = Math.max(1, Math.min(30, S.sheet.qty + Number(d.sq))); renderCustomer(); return; }
  if (d.add) {
    const s = S.sheet;
    const key = s.slug + '|' + s.kind + '|' + s.addons.slice().sort().join('+') + '|' + s.notes.trim();
    const hit = S.cart.find((l) => l.key === key);
    if (hit) hit.qty = Math.min(30, hit.qty + s.qty);
    else S.cart.push({ key, slug: s.slug, kind: s.kind, addons: s.addons.slice(), qty: s.qty, notes: s.notes.trim() });
    S.sheet = null; renderCustomer(); return;
  }
  if (d.qty) { const i = Number(d.qty); S.cart[i].qty += Number(d.d);
    if (S.cart[i].qty < 1) S.cart.splice(i, 1); renderCustomer(); return; }
  if (d.rm) { S.cart.splice(Number(d.rm), 1); renderCustomer(); return; }
  if (d.clear) { S.cart = []; renderCustomer(); return; }
  if (d.goCheckout) { S.sheet = null; S.step = 'checkout'; renderCustomer(); return; }
  if (d.type) { S.form.type = d.type; renderCustomer(); return; }
  if (d.back) { S.step = 'menu'; S.sheet = { kind: '__cart__' }; renderCustomer(); return; }
  if (d.submit) { submitOrder(); return; }
  if (d.restart) { S.myOrder = null; S.step = 'menu'; S.pin = null;
    S.form = { name: '', phone: '', type: 'delivery', zone: 1, street: '', building: '', floor: '', notes: '' };
    renderCustomer(); return; }
  if (d.locate) {
    if (!navigator.geolocation) { S.locFailed = true; renderCustomer(); return; }
    S.locating = true; S.locFailed = false; renderCustomer();
    navigator.geolocation.getCurrentPosition(
      (p) => { S.locating = false; S.pin = { lat: p.coords.latitude, lng: p.coords.longitude }; renderCustomer(); },
      () => { S.locating = false; S.locFailed = true; renderCustomer(); },
      { enableHighAccuracy: true, timeout: 9000, maximumAge: 60000 },
    );
  }
});

$('customerView').addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'inotes' && S.sheet) { S.sheet.notes = el.value; return; }
  const f = el.dataset.f;
  if (f) S.form[f] = el.value;      // No re-render: totals do not depend on these.
});

$('customerView').addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.addon && S.sheet) {
    const a = el.dataset.addon;
    S.sheet.addons = el.checked ? S.sheet.addons.concat([a]) : S.sheet.addons.filter((x) => x !== a);
    renderCustomer(); return;
  }
  if (el.dataset.f === 'zone') { S.form.zone = Number(el.value); renderCustomer(); }
});

/* Pin dragging. Pointer events cover mouse and touch with one path. */
let dragging = false;
$('customerView').addEventListener('pointerdown', (ev) => {
  if (!ev.target.closest('#mapCanvas')) return;
  dragging = true;
  ev.target.setPointerCapture(ev.pointerId);
  $('mapWrap').classList.add('dragging');
  S.pin = pinFromEvent(ev);
  drawMap();
  ev.preventDefault();
});
$('customerView').addEventListener('pointermove', (ev) => {
  if (!dragging) return;
  S.pin = pinFromEvent(ev);
  drawMap();
});
const endDrag = () => {
  if (!dragging) return;
  dragging = false;
  const w = $('mapWrap'); if (w) w.classList.remove('dragging');
  renderCustomer();               // Repaint the coordinate readout and clear the error.
};
$('customerView').addEventListener('pointerup', endDrag);
$('customerView').addEventListener('pointercancel', endDrag);

$('shopView').addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-adv],[data-receipt],[data-close],[data-scrim],[data-sold],[data-reprice]');
  if (!el) return;
  const d = el.dataset;
  if (d.scrim && ev.target !== el) return;
  if (d.adv) { patchOrder(d.adv, { status: d.to }); return; }
  if (d.receipt) { receiptFor = d.receipt; renderShop(); return; }
  if (d.close || d.scrim) { receiptFor = null; renderShop(); return; }
  if (d.sold) {
    S.cfg.soldOut = S.cfg.soldOut.includes(d.sold)
      ? S.cfg.soldOut.filter((x) => x !== d.sold)
      : S.cfg.soldOut.concat([d.sold]);
    saveConfig(); return;
  }
  if (d.reprice) {
    const pct = Number($('pct').value);
    if (!Number.isFinite(pct) || pct === 0) return;
    const factor = 1 + pct / 100;
    const round = (v) => Math.max(50000, Math.round((v * factor) / 50000) * 50000);
    MENU.categories.forEach((c) => c.products.forEach((p) => p.variants.forEach((v) => {
      S.cfg.prices[p.slug + ':' + v.k] = round(priceOf(p.slug, v.k));
    })));
    MENU.addons.forEach((a) => { S.cfg.prices['addon:' + a.slug] = round(addonPrice(a.slug)); });
    saveConfig();
  }
});

$('shopView').addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.price) {
    const v = parseMoney(el.value);
    if (v !== null) { S.cfg.prices[el.dataset.price] = v; saveConfig(); }
    else renderShop();
    return;
  }
  if (el.id === 'rate') {
    const v = parseMoney(el.value);
    S.cfg.rate = v === null ? 0 : v;
    saveConfig();
  }
});

$('shopNav').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-tab]');
  if (!b) return;
  S.shopTab = b.dataset.tab;
  receiptFor = null;
  renderShop();
});

$('paneSwitch').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-pane]');
  if (!b) return;
  S.pane = b.dataset.pane;
  renderChrome();
});

$('langBtn').addEventListener('click', () => {
  S.lang = S.lang === 'ar' ? 'en' : 'ar';
  renderAll();
});

window.addEventListener('resize', () => { if (S.step === 'checkout') drawMap(); });

/* Ages on the kitchen cards have to keep moving between orders. */
setInterval(() => { if (S.shopTab === 'board') renderShop(); }, 30000);

renderAll();
initStore();
})();
</script>
